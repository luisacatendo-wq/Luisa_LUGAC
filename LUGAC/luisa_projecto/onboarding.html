<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Onboarding 2.1.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          font-family:'Times New Roman', Times, serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #splashVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        /* Overlay de "toque para iniciar" - necessário para autoplay com som */
        .tap-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            z-index: 20;
            transition: opacity 0.3s;
        }
        .tap-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .tap-overlay .play-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        .tap-overlay p {
            font-size: 18px;
            text-align: center;
            padding: 0 30px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .sound-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 24px;
            cursor: pointer;
            display: none; /* escondido até o vídeo começar */
            align-items: center;
            justify-content: center;
            z-index: 30;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .sound-control.visible {
            display: flex;
        }
        .sound-control:hover {
            background: rgba(0,0,0,0.85);
        }
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 5;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <!-- Indicador de carregamento -->
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <div>Carregando vídeo...</div>
    </div>

    <!-- O vídeo NÃO começa muted. O overlay garante o gesto do utilizador. -->
    <video id="splashVideo" playsinline preload="auto" webkit-playsinline>
        <source src="video/ONBBOARDING.mp4" type="video/mp4">
    </video>

    <!-- Overlay de toque (obrigatório para autoplay com som) -->
    <!-- CORRIGIDO: começa VISÍVEL, não hidden -->
    <div id="tapOverlay" class="tap-overlay">
        <div class="play-icon">▶</div>
        <p>Toque para iniciar</p>
    </div>

    <!-- Botão de som -->
    <button id="soundToggle" class="sound-control" title="Desativar som">🔊</button>
</div>

<script>
(function() {
    'use strict';

    var video = document.getElementById('splashVideo');
    var soundBtn = document.getElementById('soundToggle');
    var tapOverlay = document.getElementById('tapOverlay');
    var loadingIndicator = document.getElementById('loadingIndicator');

    var hasRedirected = false;
    var hasStarted = false;
    var fallbackTimer = null;
    var redirectTimer = null;
    var videoDuration = 0;

    // ---------- REDIRECIONAMENTO ----------
    function redirectToLogin() {
        if (hasRedirected) return;
        hasRedirected = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
        if (redirectTimer) clearTimeout(redirectTimer);
        window.location.href = 'login.html';
    }

    // ---------- CONTROLE DE SOM ----------
    function updateSoundButton() {
        if (video.muted) {
            soundBtn.innerHTML = '🔇';
            soundBtn.title = 'Ativar som';
        } else {
            soundBtn.innerHTML = '🔊';
            soundBtn.title = 'Desativar som';
        }
    }

    function toggleSound(e) {
        e.stopPropagation();
        e.preventDefault();
        video.muted = !video.muted;
        updateSoundButton();
    }

    soundBtn.addEventListener('click', toggleSound);
    soundBtn.addEventListener('touchstart', function(e) {
        e.stopPropagation();
        e.preventDefault();
        video.muted = !video.muted;
        updateSoundButton();
    }, { passive: false });

    // ---------- FALLBACK DE REDIRECIONAMENTO ----------
    function scheduleFallbackRedirect() {
        // Usa a duração conhecida ou tenta obter novamente
        var dur = videoDuration || video.duration;
        if (dur && isFinite(dur) && dur > 0) {
            var safetyTime = (dur * 1000) + 3000;
            if (fallbackTimer) clearTimeout(fallbackTimer);
            fallbackTimer = setTimeout(function() {
                if (!hasRedirected) {
                    console.warn('Fallback: redirecionando após duração do vídeo');
                    redirectToLogin();
                }
            }, safetyTime);
        } else {
            // Se não temos duração, agenda um fallback genérico de 35s
            if (fallbackTimer) clearTimeout(fallbackTimer);
            fallbackTimer = setTimeout(function() {
                if (!hasRedirected) {
                    console.warn('Fallback genérico: redirecionando');
                    redirectToLogin();
                }
            }, 35000);
        }
    }

    // ---------- INICIAR VÍDEO COM SOM ----------
    function startVideo() {
        if (hasStarted || hasRedirected) return;
        hasStarted = true;

        // Esconde overlay e loading
        tapOverlay.classList.add('hidden');
        loadingIndicator.style.display = 'none';

        // Tenta iniciar COM SOM (o gesto do usuário já ocorreu)
        video.muted = false;
        video.volume = 1.0;
        updateSoundButton();

        var playPromise = video.play();

        if (playPromise !== undefined) {
            playPromise.then(function() {
                // Sucesso: vídeo a tocar com som
                console.log('Vídeo iniciado com som');
                soundBtn.classList.add('visible');
                scheduleFallbackRedirect();
            }).catch(function(error) {
                console.warn('Autoplay com som bloqueado:', error);
                // Fallback: tenta com muted (autoplay silencioso)
                video.muted = true;
                updateSoundButton();
                video.play().then(function() {
                    console.log('Vídeo iniciado mudo (autoplay bloqueou som)');
                    soundBtn.classList.add('visible');
                    scheduleFallbackRedirect();
                }).catch(function(err2) {
                    console.error('Falha total ao reproduzir:', err2);
                    // Mostra overlay novamente para o utilizador tocar
                    tapOverlay.classList.remove('hidden');
                    hasStarted = false;
                });
            });
        } else {
            // Navegadores antigos que não retornam Promise
            soundBtn.classList.add('visible');
            scheduleFallbackRedirect();
        }
    }

    // ---------- OVERLAY DE TOQUE ----------
    var overlayHandled = false;
    function onTapOverlay(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        // Evita duplo disparo (touch + click)
        if (overlayHandled) return;
        overlayHandled = true;
        setTimeout(function() { overlayHandled = false; }, 500);
        startVideo();
    }

    tapOverlay.addEventListener('click', onTapOverlay);
    tapOverlay.addEventListener('touchstart', onTapOverlay, { passive: false });

    // ---------- EVENTOS DO VÍDEO ----------
    video.addEventListener('ended', function() {
        redirectToLogin();
    });

    video.addEventListener('error', function(e) {
        console.error('Erro no vídeo:', e);
        setTimeout(redirectToLogin, 500);
    });

    video.addEventListener('loadedmetadata', function() {
        videoDuration = video.duration;
        console.log('Vídeo carregado. Duração:', videoDuration);
        loadingIndicator.style.display = 'none';
        // Se o vídeo já foi iniciado, agenda o fallback com a duração correta
        if (hasStarted) {
            scheduleFallbackRedirect();
        }
    });

    video.addEventListener('canplaythrough', function() {
        console.log('Vídeo pronto para reprodução');
        loadingIndicator.style.display = 'none';
    });

    // ---------- TRATAMENTO DE CONGELAMENTO ----------
    function tryResume() {
        if (hasRedirected || video.ended) return;
        if (video.paused && hasStarted) {
            video.play().catch(function(err) {
                console.warn('Falha ao retomar:', err);
            });
        }
    }

    video.addEventListener('stalled', function() {
        console.warn('Vídeo estagnado. Tentando retomar...');
        setTimeout(tryResume, 1000);
    });

    video.addEventListener('waiting', function() {
        console.warn('Vídeo à espera de dados. Retomando...');
        setTimeout(tryResume, 500);
    });

    // ---------- FALLBACK DE SEGURANÇA ----------
    // Se após 5 segundos o vídeo ainda não começou e o overlay está visível,
    // garante que o loading indicator não bloqueie a visão
    setTimeout(function() {
        if (!hasStarted && !hasRedirected) {
            loadingIndicator.style.display = 'none';
            tapOverlay.classList.remove('hidden');
        }
    }, 5000);

    // Fallback final: se nada funcionar em 60 segundos, redireciona
    redirectTimer = setTimeout(function() {
        if (!hasRedirected) {
            console.warn('Timeout geral: redirecionando para login');
            redirectToLogin();
        }
    }, 60000);

    // ---------- VISIBILIDADE DA PÁGINA ----------
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden && video.paused && !video.ended && hasStarted && !hasRedirected) {
            video.play().catch(function() {});
        }
    });

    // ---------- ESTADO INICIAL ----------
    updateSoundButton();
    // NÃO inicia automaticamente. O overlay está visível e aguarda o toque.
    // Isso é obrigatório em navegadores modernos para autoplay com som.

})();
</script>
</body>
</html>
