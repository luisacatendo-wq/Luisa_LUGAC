<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Onboarding 2.1.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Times New Roman', Times, serif;
            -webkit-tap-highlight-color: transparent;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #splashVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: block;
        }
        .tap-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            z-index: 20;
            transition: opacity 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        .tap-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .tap-overlay .play-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        .tap-overlay p {
            font-size: 18px;
            text-align: center;
            padding: 0 30px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .sound-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .sound-control.visible {
            display: flex;
        }
        .sound-control:hover {
            background: rgba(0,0,0,0.85);
        }
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 5;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff6b6b;
            font-size: 13px;
            z-index: 40;
            text-align: center;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            max-width: 90%;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <div>Carregando vídeo...</div>
    </div>

    <!--
        FONTES DE VÍDEO POR PRIORIDADE:
        1. Caminho local (funciona no PC e no GitHub se o arquivo existir na pasta video/)
        2. CDN externo (descomente e coloque o seu URL se o vídeo for grande)
        O navegador tenta a primeira; se falhar, tenta a segunda automaticamente.
    -->
    <video id="splashVideo" playsinline preload="auto" webkit-playsinline muted="false">
        <source src="video/ONBBOARDING.mp4" type="video/mp4">
        <!-- Se usar CDN, descomente a linha abaixo e coloque o seu URL: -->
        <!-- <source src="https://res.cloudinary.com/seu-cloud/video/upload/ONBBOARDING.mp4" type="video/mp4"> -->
        Seu navegador não suporta vídeo HTML5.
    </video>

    <div id="tapOverlay" class="tap-overlay">
        <div class="play-icon">▶</div>
        <p>Toque para iniciar</p>
    </div>

    <button id="soundToggle" class="sound-control" title="Desativar som">🔊</button>
    <div id="errorMsg" class="error-msg"></div>
</div>

<script>
(function() {
    'use strict';

    var video = document.getElementById('splashVideo');
    var soundBtn = document.getElementById('soundToggle');
    var tapOverlay = document.getElementById('tapOverlay');
    var loadingIndicator = document.getElementById('loadingIndicator');
    var errorMsg = document.getElementById('errorMsg');

    var hasRedirected = false;
    var hasStarted = false;
    var fallbackTimer = null;
    var loadCheckTimer = null;
    var videoDuration = 0;
    var lastTime = 0;

    // ---------- LOG ----------
    function log(msg) {
        try { console.log('[Onboarding] ' + msg); } catch(e) {}
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        log('ERRO: ' + msg);
    }

    function hideError() {
        errorMsg.style.display = 'none';
    }

    // ---------- REDIRECIONAMENTO ----------
    function redirectToLogin() {
        if (hasRedirected) return;
        hasRedirected = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
        if (loadCheckTimer) clearTimeout(loadCheckTimer);
        log('Redirecionando para login.html');
        window.location.href = 'login.html';
    }

    // ---------- CONTROLE DE SOM ----------
    function updateSoundButton() {
        if (video.muted) {
            soundBtn.innerHTML = '🔇';
            soundBtn.title = 'Ativar som';
        } else {
            soundBtn.innerHTML = '🔊';
            soundBtn.title = 'Desativar som';
        }
    }

    function toggleSound(e) {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        video.muted = !video.muted;
        updateSoundButton();
    }

    soundBtn.addEventListener('click', toggleSound);
    soundBtn.addEventListener('touchstart', toggleSound, { passive: false });

    // ---------- FALLBACK BASEADO EM DURAÇÃO ----------
    function scheduleFallbackRedirect() {
        if (fallbackTimer) clearTimeout(fallbackTimer);
        var dur = videoDuration || video.duration;
        if (dur && isFinite(dur) && dur > 0) {
            var safetyTime = (dur * 1000) + 4000;
            log('Fallback agendado: ' + Math.round(safetyTime/1000) + 's');
            fallbackTimer = setTimeout(function() {
                if (!hasRedirected && video.ended) {
                    log('Fallback: vídeo terminou');
                    redirectToLogin();
                }
            }, safetyTime);
        }
    }

    // ---------- INICIAR VÍDEO COM SOM ----------
    function startVideo() {
        if (hasStarted || hasRedirected) return;
        hasStarted = true;

        tapOverlay.classList.add('hidden');
        loadingIndicator.style.display = 'none';
        hideError();

        // iOS Safari exige que o play() seja chamado diretamente no gesto
        video.muted = false;
        video.volume = 1.0;
        updateSoundButton();

        var playPromise;
        try {
            playPromise = video.play();
        } catch (e) {
            log('Exceção no play(): ' + e.message);
            playPromise = null;
        }

        if (playPromise !== undefined && playPromise !== null) {
            playPromise.then(function() {
                log('Vídeo iniciado com som');
                soundBtn.classList.add('visible');
                scheduleFallbackRedirect();
            }).catch(function(error) {
                log('Autoplay com som bloqueado: ' + error.name + ' - ' + error.message);
                // Tenta com muted
                video.muted = true;
                updateSoundButton();
                var p2 = video.play();
                if (p2 !== undefined) {
                    p2.then(function() {
                        log('Vídeo iniciado mudo (autoplay bloqueou som)');
                        soundBtn.classList.add('visible');
                        scheduleFallbackRedirect();
                    }).catch(function(err2) {
                        log('Falha total: ' + err2.message);
                        showError('Não foi possível reproduzir. Toque novamente.');
                        tapOverlay.classList.remove('hidden');
                        hasStarted = false;
                    });
                }
            });
        } else {
            // Navegadores antigos
            soundBtn.classList.add('visible');
            scheduleFallbackRedirect();
        }
    }

    // ---------- OVERLAY DE TOQUE ----------
    var overlayHandled = false;
    function onTapOverlay(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        if (overlayHandled) return;
        overlayHandled = true;
        setTimeout(function() { overlayHandled = false; }, 600);
        startVideo();
    }

    tapOverlay.addEventListener('click', onTapOverlay);
    tapOverlay.addEventListener('touchstart', onTapOverlay, { passive: false });

    // ---------- EVENTOS DO VÍDEO ----------
    video.addEventListener('ended', function() {
        log('Vídeo terminou');
        redirectToLogin();
    });

    video.addEventListener('error', function() {
        var err = video.error;
        var msg = 'Erro desconhecido';
        if (err) {
            switch (err.code) {
                case 1: msg = 'Carregamento abortado'; break;
                case 2: msg = 'Erro de rede — verifique o caminho do vídeo'; break;
                case 3: msg = 'Erro de descodificação'; break;
                case 4: msg = 'Formato não suportado ou arquivo não encontrado'; break;
            }
        }
        showError(msg);
        log('Erro no vídeo: ' + msg);
        // Só redireciona se o vídeo nunca começou
        if (!hasStarted) {
            setTimeout(redirectToLogin, 3000);
        }
    });

    video.addEventListener('loadedmetadata', function() {
        videoDuration = video.duration;
        log('Metadata carregada. Duração: ' + videoDuration + 's');
        loadingIndicator.style.display = 'none';
        if (hasStarted) scheduleFallbackRedirect();
    });

    video.addEventListener('loadeddata', function() {
        log('Dados carregados');
        loadingIndicator.style.display = 'none';
    });

    video.addEventListener('canplay', function() {
        log('Pronto para tocar');
        loadingIndicator.style.display = 'none';
    });

    video.addEventListener('canplaythrough', function() {
        log('Pronto para reprodução contínua');
        loadingIndicator.style.display = 'none';
    });

    video.addEventListener('playing', function() {
        log('Vídeo a tocar');
        loadingIndicator.style.display = 'none';
    });

    video.addEventListener('timeupdate', function() {
        lastTime = video.currentTime;
    });

    // ---------- TRATAMENTO DE CONGELAMENTO ----------
    function tryResume() {
        if (hasRedirected || video.ended || !hasStarted) return;
        if (video.paused) {
            video.play().catch(function(err) {
                log('Falha ao retomar: ' + err.message);
            });
        }
    }

    video.addEventListener('stalled', function() {
        log('Vídeo estagnado. Tentando retomar...');
        setTimeout(tryResume, 1000);
    });

    video.addEventListener('waiting', function() {
        log('À espera de dados...');
        setTimeout(tryResume, 500);
    });

    // ---------- VERIFICAÇÃO DE CARREGAMENTO ----------
    // Se o vídeo não carregar metadata em 10s, mostra erro
    loadCheckTimer = setTimeout(function() {
        if (!hasStarted && !hasRedirected && video.readyState === 0) {
            showError('O vídeo não carregou. Verifique se o arquivo "video/ONBBOARDING.mp4" existe (atenção a maiúsculas/minúsculas).');
            log('AVISO: vídeo não carregou em 10s. readyState=' + video.readyState);
        }
    }, 10000);

    // ---------- VISIBILIDADE DA PÁGINA ----------
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden && video.paused && !video.ended && hasStarted && !hasRedirected) {
            video.play().catch(function() {});
        }
    });

    // ---------- ESTADO INICIAL ----------
    updateSoundButton();
    log('Página carregada. Aguardando toque do utilizador.');
    var srcEl = video.querySelector('source');
    if (srcEl) log('Caminho do vídeo: ' + srcEl.src);

    // Se o vídeo já estiver em cache e pronto, esconde o loading
    if (video.readyState >= 1) {
        loadingIndicator.style.display = 'none';
    }

})();
</script>
</body>
</html>
