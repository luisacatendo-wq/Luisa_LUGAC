<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LUGAC | Alterar Senha</title>
    <!-- Bootstrap 5 + Icons + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            font-family: 'Times New Roman', Times, serif;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ========== TEMA CLARO ========== */
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.50);
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            --text-primary: #1a2e2a;
            --text-secondary: #4a6a5e;
            --text-light: #ffffff;
            --input-bg: #f7faf9;
            --input-border: #dce5e2;
            --input-focus: #2b7a4b;
            --accent-green: #2b7a4b;
            --accent-hover: #1e5a3a;
            --accent-gradient: linear-gradient(135deg, #2b7a4b 0%, #1e5a3a 100%);
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
            --card-radius: 24px;
            --input-radius: 12px;
        }

        /* ========== TEMA ESCURO ========== */
        body.dark {
            --bg-overlay: rgba(0, 0, 0, 0.70);
            --glass-bg: rgba(20, 30, 28, 0.88);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            --text-primary: #eef4f0;
            --text-secondary: #b8d0c2;
            --input-bg: #2a3c36;
            --input-border: #3a4f48;
            --input-focus: #4c9f70;
            --accent-green: #4c9f70;
            --accent-hover: #6bb886;
            --accent-gradient: linear-gradient(135deg, #4c9f70 0%, #2b7a4b 100%);
            --error-bg: #3b1e1e;
            --error-text: #fca5a5;
        }
.logo-slogan1{
            width:  50px;
            height: 50px;
        }
        /* ========== WRAPPER ========== */
        .change-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            background-image: url('images/alterzar-senha.jpg');
            background-position: center 30%;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
            padding: 2rem;
        }

        .change-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--bg-overlay);
            z-index: 0;
        }

        /* ========== SLOGAN ========== */
        .slogan-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            padding: 0 2rem;
            max-width: 650px;
            pointer-events: none;
        }

        .slogan-overlay  {
            max-height: 60px;
            width: auto;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.4));
            margin-bottom: 0.5rem;
        }
        
        .logo-slogan{
            width: 200px;
            height: 200px;
        }

        .slogan-overlay h2 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .slogan-overlay p {
            font-size: 0.9rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.3px;
            margin-bottom: 0;
        }

        /* ========== PAINEL PRINCIPAL ========== */
        .form-panel {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .change-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: var(--card-radius);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 2.5rem 2.5rem 2rem;
            transition: all 0.3s ease;
        }

        /* ========== HEADER ========== */
        .card-header-custom {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .card-header-custom .brand-icon {
            font-size: 2.6rem;
            color: var(--accent-green);
            display: inline-block;
            
            padding: 0.6rem;
            border-radius: 90px;
            margin-bottom: 0.75rem;
        }

        body.dark .card-header-custom .brand-icon {
            
        }

        .card-header-custom h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .card-header-custom p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /* ========== AÇÕES SUPERIORES ========== */
        .top-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .action-btn {
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 1.2rem;
            color: var(--text-primary);
            transition: 0.2s;
            padding: 0.35rem 0.5rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }

        body.dark .action-btn {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
        }

        .action-btn:hover {
            transform: scale(1.08);
            background: rgba(43, 122, 75, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        body.dark .action-btn:hover {
            background: rgba(76, 159, 112, 0.2);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .dropdown-menu-custom {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.4rem;
            min-width: 160px;
        }

        .dropdown-menu-custom .dropdown-item {
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .dropdown-menu-custom .dropdown-item:hover {
            background: rgba(43, 122, 75, 0.1);
            color: var(--accent-green);
        }

        body.dark .dropdown-menu-custom .dropdown-item:hover {
            background: rgba(76, 159, 112, 0.15);
        }

        /* ========== FORMULÁRIO ========== */
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .input-group-custom {
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: var(--input-radius);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .input-group-custom:focus-within {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(43, 122, 75, 0.12);
        }

        body.dark .input-group-custom:focus-within {
            box-shadow: 0 0 0 4px rgba(76, 159, 112, 0.15);
        }

        .form-control {
            background: transparent;
            border: none;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            border-radius: var(--input-radius);
            flex: 1;
            outline: none;
        }

        .form-control::placeholder {
            color: #a0b8b0;
        }

        body.dark .form-control::placeholder {
            color: #6a8a7e;
        }

        .form-control:focus {
            background: transparent;
            box-shadow: none;
            border-color: transparent;
            color: var(--text-primary);
        }

        /* ========== BOTÃO ALTERAR ========== */
        .btn-change {
            background: var(--accent-gradient);
            border: none;
            padding: 0.85rem;
            font-weight: 700;
            border-radius: var(--input-radius);
            font-size: 1rem;
            transition: 0.3s ease;
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(43, 122, 75, 0.25);
            letter-spacing: 0.3px;
            width: 100%;
        }

        .btn-change:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(43, 122, 75, 0.35);
        }

        .btn-change:active {
            transform: translateY(0px);
        }

        body.dark .btn-change {
            box-shadow: 0 6px 24px rgba(76, 159, 112, 0.2);
        }

        body.dark .btn-change:hover {
            box-shadow: 0 10px 32px rgba(76, 159, 112, 0.3);
        }

        /* ========== BOTÃO VOLTAR ========== */
        .btn-outline-back {
            border-radius: var(--input-radius);
            padding: 0.6rem;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--input-border);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }
        .btn-outline-back:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(43, 122, 75, 0.05);
            transform: translateY(-1px);
        }

        body.dark .btn-outline-back:hover {
            background: rgba(76, 159, 112, 0.08);
        }

        /* ========== VALIDAÇÕES E ERROS ========== */
        .invalid-feedback-custom {
            font-size: 0.7rem;
            color: var(--error-text);
            margin-top: 4px;
            font-weight: 500;
        }

        /* ========== TOAST ========== */
        .toast-custom {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1090;
            min-width: 280px;
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-left: 5px solid var(--accent-green);
            box-shadow: var(--glass-shadow);
            padding: 1rem 1.25rem;
        }

        .toast-custom .toast-body {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .toast-custom .btn-close {
            filter: var(--text-primary) === '#ffffff' ? 'invert(1)' : 'invert(0.4)';
        }

        body.dark .toast-custom .btn-close {
            filter: invert(1);
        }

        .text-muted-custom {
            font-size: 0.7rem;
            color: var(--text-secondary) !important;
            opacity: 0.8;
        }

        /* ========== RESPONSIVIDADE ========== */
        @media (max-width: 576px) {
            .change-wrapper {
                padding: 1rem;
                background-position: center 50%;
            }

            .change-card {
                padding: 1.75rem 1.25rem 1.5rem;
                border-radius: 20px;
            }

            .card-header-custom h2 {
                font-size: 1.35rem;
            }

            .card-header-custom .brand-icon {
                font-size: 2.2rem;
                padding: 0.5rem;
            }

            .top-actions {
                gap: 0.5rem;
            }

            .action-btn {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }

            .slogan-overlay {
                bottom: 20px;
                padding: 0 1rem;
                max-width: 90%;
            }

            .slogan-overlay h2 {
                font-size: 1.2rem;
            }

            .slogan-overlay p {
                font-size: 0.75rem;
            }

            .slogan-overlay .logo-slogan {
                max-height: 40px;
            }

            .form-control {
                font-size: 0.9rem;
                padding: 0.65rem 0.85rem;
            }

            .toast-custom {
                left: 15px;
                right: 15px;
                min-width: auto;
                bottom: 15px;
            }
        }

        @media (max-width: 400px) {
            .change-card {
                padding: 1.25rem 1rem;
            }
        }

        /* ========== ANIMAÇÃO ========== */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .change-card {
            animation: fadeSlideUp 0.6s ease forwards;
        }

        .slogan-overlay {
            animation: fadeSlideUp 0.8s ease 0.2s both;
        }
    </style>
</head>
<body>

<div class="change-wrapper">

    <!-- PAINEL PRINCIPAL -->
    <div class="form-panel">
        <div class="change-card">
            <!-- AÇÕES SUPERIORES -->
            <div class="top-actions">
                <button id="themeToggleBtn" class="action-btn" aria-label="Alternar tema">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <div class="dropdown">
                    <button class="action-btn dropdown-toggle" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-globe2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-custom" aria-labelledby="langDropdown">
                        <li><a class="dropdown-item lang-option" data-lang="pt" href="#">🇵🇹 Português</a></li>
                        <li><a class="dropdown-item lang-option" data-lang="en" href="#">🇬🇧 English</a></li>
                        <li><a class="dropdown-item lang-option" data-lang="es" href="#">🇪🇸 Español</a></li>
                    </ul>
                </div>
            </div>

            <!-- HEADER -->
            <div class="card-header-custom">
                <div class="brand-icon"><a href="index.html">
                        <img class="logo-slogan" src="images/lugac-logo.png" alt="LUGAC">
                    </a></div>
                <h2 id="changeTitle">Alterar senha</h2>
                <p id="changeSubtitle">Digite sua senha atual e defina uma nova senha</p>
            </div>

            <!-- FORMULÁRIO -->
            <form id="changePasswordForm" novalidate>
                <div class="mb-4">
                    <label class="form-label" id="currentPasswordLabel">Senha atual</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" id="currentPasswordInput" placeholder="••••••••" required>
                    </div>
                    <div class="invalid-feedback-custom" id="currentPasswordError"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" id="newPasswordLabel">Nova senha</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" id="newPasswordInput" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <div class="invalid-feedback-custom" id="newPasswordError"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" id="confirmPasswordLabel">Confirmar nova senha</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Digite a nova senha novamente" required>
                    </div>
                    <div class="invalid-feedback-custom" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="btn-change mb-3" id="changeBtn">
                    <span id="btnText">Alterar senha</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>

                <a href="login.html" class="btn-outline-back">
                    <i class="bi bi-arrow-left"></i> Voltar para o login
                </a>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted-custom" id="demoNote">🔐 Simulação: qualquer senha atual (não vazia) + nova senha com mínimo 6 caracteres.</small>
            </div>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast-custom d-none" id="notificationToast" role="alert">
    <div class="d-flex align-items-center">
        <i class="bi bi-check-circle-fill me-2" style="color: var(--accent-green); font-size: 1.4rem;"></i>
        <div class="toast-body p-0" id="toastMessage"></div>
        <button type="button" class="btn-close ms-auto" id="closeToast" aria-label="Close"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ============================================================
    //  TRADUÇÕES
    // ============================================================
    const translations = {
        pt: {
            changeTitle: "Alterar senha",
            changeSubtitle: "Digite sua senha atual e defina uma nova senha",
            currentPasswordLabel: "Senha atual",
            newPasswordLabel: "Nova senha",
            confirmPasswordLabel: "Confirmar nova senha",
            btnText: "Alterar senha",
            demoNote: "🔐 Simulação: qualquer senha atual (não vazia) + nova senha com mínimo 6 caracteres.",
            currentRequired: "Senha atual é obrigatória",
            newPasswordRequired: "Nova senha é obrigatória",
            newPasswordMinLength: "A nova senha deve ter pelo menos 6 caracteres",
            confirmRequired: "Confirme sua nova senha",
            confirmMismatch: "As senhas não coincidem",
            successMsg: "✅ Senha alterada com sucesso! Sua nova senha foi atualizada.",
            errorMsg: "❌ Falha ao alterar senha. Verifique os dados e tente novamente."
        },
        en: {
            changeTitle: "Change password",
            changeSubtitle: "Enter your current password and set a new password",
            currentPasswordLabel: "Current password",
            newPasswordLabel: "New password",
            confirmPasswordLabel: "Confirm new password",
            btnText: "Change password",
            demoNote: "🔐 Simulation: any non-empty current password + new password with at least 6 characters.",
            currentRequired: "Current password is required",
            newPasswordRequired: "New password is required",
            newPasswordMinLength: "New password must be at least 6 characters",
            confirmRequired: "Please confirm your new password",
            confirmMismatch: "Passwords do not match",
            successMsg: "✅ Password changed successfully! Your new password has been updated.",
            errorMsg: "❌ Failed to change password. Please check the data and try again."
        },
        es: {
            changeTitle: "Cambiar contraseña",
            changeSubtitle: "Ingrese su contraseña actual y establezca una nueva",
            currentPasswordLabel: "Contraseña actual",
            newPasswordLabel: "Nueva contraseña",
            confirmPasswordLabel: "Confirmar nueva contraseña",
            btnText: "Cambiar contraseña",
            demoNote: "🔐 Simulación: cualquier contraseña actual (no vacía) + nueva contraseña con al menos 6 caracteres.",
            currentRequired: "La contraseña actual es obligatoria",
            newPasswordRequired: "La nueva contraseña es obligatoria",
            newPasswordMinLength: "La nueva contraseña debe tener al menos 6 caracteres",
            confirmRequired: "Confirme su nueva contraseña",
            confirmMismatch: "Las contraseñas no coinciden",
            successMsg: "✅ ¡Contraseña cambiada con éxito! Su nueva contraseña ha sido actualizada.",
            errorMsg: "❌ Error al cambiar la contraseña. Verifique los datos e intente de nuevo."
        }
    };

    // ============================================================
    //  ESTADO GLOBAL
    // ============================================================
    let currentLang = localStorage.getItem('kwendaLang') || 'pt';
    let isDark = localStorage.getItem('kwendaTheme') === 'dark';

    // ============================================================
    //  DOM REFS
    // ============================================================
    const themeBtn = document.getElementById('themeToggleBtn');
    const changeForm = document.getElementById('changePasswordForm');
    const currentPasswordInput = document.getElementById('currentPasswordInput');
    const newPasswordInput = document.getElementById('newPasswordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const changeBtn = document.getElementById('changeBtn');
    const btnTextSpan = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const toastEl = document.getElementById('notificationToast');
    const toastMessageSpan = document.getElementById('toastMessage');
    const closeToastBtn = document.getElementById('closeToast');

    const currentError = document.getElementById('currentPasswordError');
    const newError = document.getElementById('newPasswordError');
    const confirmError = document.getElementById('confirmPasswordError');

    const i18nEls = {
        changeTitle: document.getElementById('changeTitle'),
        changeSubtitle: document.getElementById('changeSubtitle'),
        currentPasswordLabel: document.getElementById('currentPasswordLabel'),
        newPasswordLabel: document.getElementById('newPasswordLabel'),
        confirmPasswordLabel: document.getElementById('confirmPasswordLabel'),
        demoNote: document.getElementById('demoNote')
    };

    // ============================================================
    //  FUNÇÕES DE IDIOMA
    // ============================================================
    function applyLanguage() {
        const t = translations[currentLang];
        if (i18nEls.changeTitle) i18nEls.changeTitle.innerText = t.changeTitle;
        if (i18nEls.changeSubtitle) i18nEls.changeSubtitle.innerText = t.changeSubtitle;
        if (i18nEls.currentPasswordLabel) i18nEls.currentPasswordLabel.innerText = t.currentPasswordLabel;
        if (i18nEls.newPasswordLabel) i18nEls.newPasswordLabel.innerText = t.newPasswordLabel;
        if (i18nEls.confirmPasswordLabel) i18nEls.confirmPasswordLabel.innerText = t.confirmPasswordLabel;
        if (i18nEls.demoNote) i18nEls.demoNote.innerText = t.demoNote;
        if (btnTextSpan) btnTextSpan.innerText = t.btnText;
    }

    // ============================================================
    //  VALIDAÇÕES
    // ============================================================
    function validateCurrentPassword() {
        const t = translations[currentLang];
        const value = currentPasswordInput.value.trim();
        if (!value) {
            currentError.innerText = t.currentRequired;
            return false;
        }
        currentError.innerText = '';
        return true;
    }

    function validateNewPassword() {
        const t = translations[currentLang];
        const value = newPasswordInput.value;
        if (!value) {
            newError.innerText = t.newPasswordRequired;
            return false;
        }
        if (value.length < 6) {
            newError.innerText = t.newPasswordMinLength;
            return false;
        }
        newError.innerText = '';
        return true;
    }

    function validateConfirmPassword() {
        const t = translations[currentLang];
        const newPwd = newPasswordInput.value;
        const confirmPwd = confirmPasswordInput.value;
        if (!confirmPwd) {
            confirmError.innerText = t.confirmRequired;
            return false;
        }
        if (newPwd !== confirmPwd) {
            confirmError.innerText = t.confirmMismatch;
            return false;
        }
        confirmError.innerText = '';
        return true;
    }

    function validateAllFields() {
        const isCurrentValid = validateCurrentPassword();
        const isNewValid = validateNewPassword();
        const isConfirmValid = validateConfirmPassword();
        return isCurrentValid && isNewValid && isConfirmValid;
    }

    // ============================================================
    //  TOAST
    // ============================================================
    function showToast(message, isError = false) {
        toastMessageSpan.innerText = message;
        toastEl.classList.remove('d-none');
        toastEl.style.borderLeftColor = isError ? '#e53e3e' : 'var(--accent-green)';
        setTimeout(() => toastEl.classList.add('d-none'), 4000);
    }

    // ============================================================
    //  SIMULAÇÃO DE ALTERAÇÃO
    // ============================================================
    async function simulateChangePassword(currentPwd, newPwd, confirmPwd) {
        return new Promise((resolve) => {
            setTimeout(() => {
                if (currentPwd && newPwd && confirmPwd && newPwd === confirmPwd && newPwd.length >= 6) {
                    resolve({ success: true, message: translations[currentLang].successMsg });
                } else {
                    resolve({ success: false, message: translations[currentLang].errorMsg });
                }
            }, 800);
        });
    }

    // ============================================================
    //  EVENTOS DO FORMULÁRIO
    // ============================================================
    changeForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!validateAllFields()) return;

        btnTextSpan.classList.add('d-none');
        btnSpinner.classList.remove('d-none');
        changeBtn.disabled = true;

        const currentPwd = currentPasswordInput.value.trim();
        const newPwd = newPasswordInput.value;
        const confirmPwd = confirmPasswordInput.value;

        const result = await simulateChangePassword(currentPwd, newPwd, confirmPwd);

        btnTextSpan.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        changeBtn.disabled = false;

        showToast(result.message, !result.success);

        if (result.success) {
            currentPasswordInput.value = '';
            newPasswordInput.value = '';
            confirmPasswordInput.value = '';
            currentError.innerText = '';
            newError.innerText = '';
            confirmError.innerText = '';
        }
    });

    // ============================================================
    //  EVENTOS DE INPUT
    // ============================================================
    currentPasswordInput.addEventListener('input', validateCurrentPassword);
    newPasswordInput.addEventListener('input', () => {
        validateNewPassword();
        if (confirmPasswordInput.value) validateConfirmPassword();
    });
    confirmPasswordInput.addEventListener('input', validateConfirmPassword);

    // ============================================================
    //  TEMA
    // ============================================================
    function setTheme(enableDark) {
        if (enableDark) {
            document.body.classList.add('dark');
            localStorage.setItem('kwendaTheme', 'dark');
            themeBtn.querySelector('i').className = 'bi bi-sun-fill';
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('kwendaTheme', 'light');
            themeBtn.querySelector('i').className = 'bi bi-moon-stars';
        }
    }

    themeBtn.addEventListener('click', () => {
        isDark = !isDark;
        setTheme(isDark);
    });

    // ============================================================
    //  IDIOMA
    // ============================================================
    document.querySelectorAll('.lang-option').forEach(option => {
        option.addEventListener('click', (e) => {
            e.preventDefault();
            currentLang = option.getAttribute('data-lang');
            localStorage.setItem('kwendaLang', currentLang);
            applyLanguage();
            validateCurrentPassword();
            validateNewPassword();
            validateConfirmPassword();
        });
    });

    // ============================================================
    //  FECHAR TOAST
    // ============================================================
    if (closeToastBtn) {
        closeToastBtn.addEventListener('click', () => toastEl.classList.add('d-none'));
    }

    // ============================================================
    //  INICIALIZAÇÃO
    // ============================================================
    setTheme(isDark);
    applyLanguage();
    validateAllFields();
</script>
</body>
</html>
